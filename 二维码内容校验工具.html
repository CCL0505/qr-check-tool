<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码扫码校验工具（本地版）</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {box-sizing: border-box;font-family: system-ui, sans-serif;margin:0;padding:0;}
        body {background:#f5f7fa;padding:20px;max-width:1200px;margin:0 auto;}
        .card {background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #00000014;}
        h2 {margin-bottom:16px;color:#222;font-size:20px;display:flex;justify-content:space-between;align-items:center;}
        .row {display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
        input, select, button {padding:10px 12px;font-size:14px;border:1px solid #dcdfe6;border-radius:6px;outline:none;}
        button {cursor:pointer;background:#409eff;color:white;border:none;}
        button.danger {background:#f56c6c;}
        button.success {background:#67c23a;}
        button.warning {background:#ff9500;}
        #video-container {position:relative;width:100%;max-width:400px;margin:10px auto;border:1px solid #ccc;border-radius:8px;overflow:hidden;}
        #video {width:100%;display:block;}
        #canvas {display:none;}
        .result {font-size:24px;font-weight:bold;margin:12px 0;}
        .ok {color:#67c23a;}
        .ng {color:#f56c6c;}
        .repeat {color:#ff8800;}
        .config-panel {border:1px solid #ccc;padding:16px;border-radius:8px;background:#fafafa;}
        .rule-item {display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap;background:#fff;padding:10px;border-radius:8px;}
        .rule-index {width:32px;height:32px;border-radius:50%;background:#67c23a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;}
        .history-item {padding:8px;border-bottom:1px solid #eee;font-size:14px;}
        .history-time {color:#888;font-size:12px;}
        .hidden {display:none !important;}
        .lock-status{padding:4px 16px;border-radius:20px;background:#ffe9cc;color:#d47500;}
        .stat-wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;}
        .stat-item{text-align:center;padding:12px 8px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;}
        .stat-num{font-size:26px;font-weight:bold;}
        .stat-label{font-size:13px;color:#666;margin-top:4px;}
        input:disabled,select:disabled{background:#f3f4f6;color:#888;cursor:not-allowed;}

        .alert-mask{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center;}
        .alert-dialog{background:#fff;padding:24px 28px;border-radius:10px;min-width:300px;}
        .alert-title{font-size:20px;color:#f56c6c;font-weight:bold;margin-bottom:12px;}
        .alert-desc{margin-bottom:20px;font-size:15px;}
    </style>
</head>
<body>
    <div class="card">
        <h2>二维码扫码校验</h2>
        <div class="row">
            <label>扫码模式：</label>
            <select id="scanModeSel">
                <option value="normal">常规模式：扫1码后关闭摄像头</option>
                <option value="continuous">连续扫码模式：自动循环扫码</option>
            </select>
        </div>
        <div id="video-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>
        <div class="row">
            <button id="startScan">开启摄像头扫码</button>
            <button id="stopScan" class="danger">关闭摄像头</button>
        </div>
        <div class="row">
            <input type="text" id="qrcodeInput" placeholder="也可以手动录入二维码内容">
            <button id="manualCheck">手动校验</button>
        </div>
        <div>当前扫码内容：<span id="currentContent">-</span></div>
        <div class="result" id="checkResult">待校验</div>
    </div>

    <div class="card">
        <h2>规则配置 <span class="lock-status" id="lockStatus">已锁定</span>
            <button id="unlockConfig" class="warning">解锁</button>
            <button id="changePwdBtn" class="warning hidden">修改密码</button>
        </h2>

        <div class="stat-wrap">
            <div class="stat-item"><div class="stat-num" id="statTotal">0</div><div class="stat-label">总扫描数</div></div>
            <div class="stat-item"><div class="stat-num" id="statOk">0</div><div class="stat-label">合格数量</div></div>
            <div class="stat-item"><div class="stat-num" id="statNg">0</div><div class="stat-label">不合格数量</div></div>
            <div class="stat-item"><div class="stat-num" id="statRepeat">0</div><div class="stat-label">重码数</div></div>
            <div class="stat-item"><div class="stat-num" id="statRate">0.00%</div><div class="stat-label">合格率</div></div>
        </div>

        <div class="config-panel">
            <div class="row">
                <button id="addRule">+新增规则字段</button>
                <button id="saveConfig" class="success">保存配置</button>
                <button id="lockConfig">锁定配置</button>
            </div>
            <div id="ruleList"></div>
        </div>
    </div>

    <div class="card">
        <h2>扫码历史记录 <button id="clearHistory" class="danger">清空历史</button></h2>
        <div id="historyList"></div>
    </div>

    <div id="alertMask" class="alert-mask hidden">
        <div class="alert-dialog">
            <div class="alert-title" id="alertTitle">报警</div>
            <div class="alert-desc" id="alertDesc"></div>
            <button id="alertCloseBtn">确定关闭，继续扫码</button>
        </div>
    </div>

<script>
const $ = s=>document.querySelector(s);
const $$ = s=>document.querySelectorAll(s);

// ==========【内置默认规则】所有人第一次打开默认加载截图5条规则 ==========
const DEFAULT_BUILTIN_CONFIG = {
    password:"123456",
    rules:[
        {mode:"fixed", len:16, value:"14040200538_C01#"},
        {mode:"fixed", len:1, value:"T"},
        {mode:"length", len:6, value:""},
        {mode:"fixed", len:3, value:"000"},
        {mode:"length", len:4, value:""}
    ]
};

let isConfigUnlock = false;
let scanHistory = JSON.parse(localStorage.getItem("qrScanHistory")) || [];
let video, canvas, ctx;
let scanRunning = false;
let waitAlertClose = false;
let stat = JSON.parse(localStorage.getItem("qrStat"))||{total:0,ok:0,ng:0,repeat:0};

//读取本地存储，如果为空，直接使用内置默认配置
function loadLocalConfig(){
    const localStr = localStorage.getItem("qrCheckConfig");
    if(localStr){
        return JSON.parse(localStr);
    }else{
        //本地无配置，返回内置默认规则（第一次打开网页所有人都是这套）
        return JSON.parse(JSON.stringify(DEFAULT_BUILTIN_CONFIG));
    }
}
let scanConfig = loadLocalConfig();

// ==========弹窗修复：事件使用事件委托，修复按钮失效，点击遮罩关闭弹窗==========
document.body.addEventListener("click",function(e){
    if(e.target.id === "alertCloseBtn"){
        closeAlert();
    }
    if(e.target.id === "alertMask"){
        closeAlert();
    }
});

//关闭弹窗函数
function closeAlert(){
    $("#alertMask").classList.add("hidden");
    waitAlertClose = false;
    const mode = $("#scanModeSel").value;
    //连续扫码模式弹窗关闭恢复摄像头
    if(mode === "continuous") startCamera();
}

function renderAll(){
    renderRuleList();
    renderHistory();
    renderStat();
}

window.onload = ()=>{
    renderAll();
    $("#qrcodeInput").addEventListener("keydown",function(e){
        if(e.key==="Enter") $("#manualCheck").click();
    });
};

// ==================== 统计 ====================
function renderStat(){
    $("#statTotal").innerText = stat.total;
    $("#statOk").innerText = stat.ok;
    $("#statNg").innerText = stat.ng;
    $("#statRepeat").innerText = stat.repeat;
    const denominator = stat.total;
    const rate = denominator>0 ? ((stat.ok/(stat.total-stat.repeat))*100).toFixed(2)+"%" : "0.00%";
    $("#statRate").innerText = rate;
    localStorage.setItem("qrStat",JSON.stringify(stat));
}

// ==================== 解锁 / 锁定 ====================
$("#unlockConfig").onclick = ()=>{
    const pwd = prompt("请输入配置密码：");
    if(pwd === scanConfig.password){
        isConfigUnlock = true;
        $("#lockStatus").innerText="已解锁";
        $("#changePwdBtn").classList.remove("hidden");
        renderRuleList();
        alert("配置已解锁，可以编辑规则");
    }else{
        alert("密码错误！");
    }
};

$("#lockConfig").onclick = ()=>{
    isConfigUnlock = false;
    $("#lockStatus").innerText="已锁定";
    $("#changePwdBtn").classList.add("hidden");
    renderRuleList();
};

//修改密码
$("#changePwdBtn").onclick = async ()=>{
    const oldPwd = prompt("输入旧密码：");
    if(oldPwd!==scanConfig.password){ alert("旧密码不正确"); return; }
    const new1 = prompt("输入新密码：");
    if(!new1||new1.trim()===""){ alert("密码不能为空"); return; }
    const new2 = prompt("再次输入新密码确认：");
    if(new1!==new2){ alert("两次密码不一致"); return; }
    scanConfig.password = new1;
    localStorage.setItem("qrCheckConfig", JSON.stringify(scanConfig));
    alert("密码修改成功，已保存本地！");
    renderRuleList();
};

// ==================== 规则列表渲染 ====================
function renderRuleList(){
    const wrap = $("#ruleList");
    wrap.innerHTML = "";
    scanConfig.rules.forEach((item,idx)=>{
        const div = document.createElement("div");
        div.className = "rule-item";
        div.innerHTML = `
            <div class="rule-index">${idx+1}</div>
            <select class="rule-mode" data-idx="${idx}" ${isConfigUnlock?"":"disabled"}>
                <option value="fixed" ${item.mode==="fixed"?"selected":""}>固定码模式</option>
                <option value="length" ${item.mode==="length"?"selected":""}>长度校验模式</option>
            </select>
            <span>(</span>
            <input type="number" class="rule-len" data-idx="${idx}" value="${item.len}" style="width:70px;" ${isConfigUnlock?"":"disabled"}>
            <span>)位</span>
            <span class="fixed-label ${item.mode==='length'?'hidden':''}">内容:</span>
            <input type="text" class="rule-val ${item.mode==='length'?'hidden':''}" data-idx="${idx}" value="${item.value}" style="width:220px;" ${isConfigUnlock?"":"disabled"}>
            <button class="del-rule danger" data-idx="${idx}" ${isConfigUnlock?"":"disabled"}>删除</button>
        `;
        wrap.appendChild(div);
    });
    $("#addRule").disabled = !isConfigUnlock;
    $("#saveConfig").disabled = !isConfigUnlock;
    $$(".rule-mode").forEach(sel=>{
        sel.onchange=function(){
            if(!isConfigUnlock)return;
            const i=Number(this.dataset.idx);
            scanConfig.rules[i].mode=this.value;
            renderRuleList();
        };
    });
    $$(".del-rule").forEach(btn=>{
        btn.onclick=()=>{
            if(!isConfigUnlock)return;
            const i=Number(btn.dataset.idx);
            scanConfig.rules.splice(i,1);
            renderRuleList();
        };
    });
}

$("#addRule").onclick = ()=>{
    scanConfig.rules.push({mode:"fixed", len:1, value:""});
    renderRuleList();
};

$("#saveConfig").onclick = ()=>{
    $$(".rule-len").forEach(input=>{
        const i=Number(input.dataset.idx);
        scanConfig.rules[i].len=Number(input.value);
    });
    $$(".rule-val").forEach(input=>{
        const i=Number(input.dataset.idx);
        scanConfig.rules[i].value=input.value.trim();
    });
    localStorage.setItem("qrCheckConfig", JSON.stringify(scanConfig));
    alert("配置已保存到本地！");
    renderRuleList();
};

// ==================== 校验核心 ====================
function checkContent(text){
    if(!text) return {pass:false,failPos:0,failLen:0};
    let pos=0;
    const txtFull=text.trim();
    for(const rule of scanConfig.rules){
        const len=Number(rule.len);
        if(pos+len > txtFull.length) return {pass:false,failPos:pos,failLen:txtFull.length-pos};
        const segStr=txtFull.substr(pos,len);
        if(rule.mode==="fixed"){
            if(segStr !== rule.value.trim()) return {pass:false,failPos:pos,failLen:len};
        }else if(rule.mode==="length"){
            if(segStr.length !== len) return {pass:false,failPos:pos,failLen:len};
        }
        pos+=len;
    }
    return {pass:true,failPos:-1,failLen:0};
}

function getHighlightHtml(rawText,failPos,failLen){
    if(failPos<0||failLen<=0) return escapeHtml(rawText);
    const before=escapeHtml(rawText.substring(0,failPos));
    const errorPart=escapeHtml(rawText.substr(failPos,failLen));
    const after=escapeHtml(rawText.substring(failPos+failLen));
    return `${before}<span style="color:red;font-weight:bold">${errorPart}</span>${after}`;
}

function escapeHtml(str){
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function showAlert(title,desc){
    $("#alertTitle").innerText=title;
    $("#alertDesc").innerText=desc;
    $("#alertMask").classList.remove("hidden");
    waitAlertClose=true;
}

async function handleScanResult(text){
    const txt=text.trim();
    stat.total+=1;
    let isRepeat=false,pass=false,showHtml;
    const existed=scanHistory.some(h=>h.content.trim()===txt);
    if(existed){
        isRepeat=true;
        stat.repeat+=1;stat.ng+=1;
        $("#checkResult").innerText="重码";
        $("#checkResult").className="result repeat";
        showHtml=escapeHtml(text);
        stopCamera();
        showAlert("⚠重码报警","检测到重复二维码："+txt);
    }else{
        const cr=checkContent(text);
        pass=cr.pass;
        if(pass){
            stat.ok+=1;
            $("#checkResult").innerText="合格";
            $("#checkResult").className="result ok";
            showHtml=escapeHtml(text);
        }else{
            stat.ng+=1;
            $("#checkResult").innerText="不合格";
            $("#checkResult").className="result ng";
            showHtml=getHighlightHtml(text,cr.failPos,cr.failLen);
            stopCamera();
            showAlert("⚠校验不合格报警","二维码内容校验不通过："+txt);
        }
    }
    $("#currentContent").innerHTML=showHtml;
    renderStat();
    const now=new Date().toLocaleString();
    scanHistory.unshift({content:text,time:now,isRepeat:isRepeat,pass:pass});
    localStorage.setItem("qrScanHistory",JSON.stringify(scanHistory));
    renderHistory();

    //====需求1：扫码/手动校验完成，强制清空手动录入输入框====
    $("#qrcodeInput").value = "";

    const mode=$("#scanModeSel").value;
    if(mode==="continuous" && pass && !isRepeat){
        setTimeout(async()=>{await startCamera();},300);
    }
}

$("#manualCheck").onclick=()=>{
    const val=$("#qrcodeInput").value.trim();
    if(!val) return alert("请输入二维码内容");
    handleScanResult(val);
};

// ==================== 历史记录 ====================
function renderHistory(){
    const wrap=$("#historyList");
    wrap.innerHTML="";
    scanHistory.forEach(item=>{
        const div=document.createElement("div");
        div.className="history-item";
        let tag="";
        if(item.isRepeat) tag="【重码】";
        else if(item.pass) tag="【合格】";
        else tag="【不合格】";
        div.innerHTML=`<div>${tag} ${escapeHtml(item.content)}</div><div class="history-time">${item.time}</div>`;
        wrap.appendChild(div);
    });
}

$("#clearHistory").onclick=()=>{
    if(confirm("确定清空全部历史记录与统计数据？")){
        scanHistory=[];
        stat={total:0,ok:0,ng:0,repeat:0};
        localStorage.removeItem("qrScanHistory");
        localStorage.removeItem("qrStat");
        renderHistory();
        renderStat();
    }
};

// ==================== 摄像头扫码 ====================
async function startCamera(){
    if(scanRunning) return;
    if(waitAlertClose) return;
    video=$("#video");canvas=$("#canvas");ctx=canvas.getContext("2d");
    try{
        const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
        video.srcObject=stream;scanRunning=true;requestAnimationFrame(scanLoop);
    }catch(e){
        alert("无法打开摄像头，请授权相机权限");console.error(e);
    }
}
function stopCamera(){
    if(!scanRunning) return;
    const stream=video?.srcObject;
    if(stream) stream.getTracks().forEach(t=>t.stop());
    scanRunning=false;
}
$("#startScan").onclick=startCamera;
$("#stopScan").onclick=stopCamera;

function scanLoop(){
    if(!scanRunning) return;
    if(waitAlertClose) return;
    if(video.readyState===video.HAVE_ENOUGH_DATA){
        canvas.height=video.videoHeight;canvas.width=video.videoWidth;
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=jsQR(imgData.data,canvas.width,canvas.height);
        if(code){ handleScanResult(code.data); return; }
    }
    requestAnimationFrame(scanLoop);
}
</script>
</body>
</html>
