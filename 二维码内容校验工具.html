<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>二维码校验工具（微信兼容优化）</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { padding: 12px; margin: 0; background: #f5f7fa; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 1px 4px #0002; }
    .wechat-tip{background:#fff2cc;color:#b46400;padding:10px;border-radius:8px;margin-bottom:12px;border:1px solid #ffd591;}
    h2 { text-align: center; margin-top: 0; color: #222; }
    .row { margin: 10px 0; }
    label { display: block; margin-bottom: 4px; font-weight: 500; }
    input, select, button { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { background: #2b78e4; color: #fff; border: none; cursor: pointer; margin-top: 4px; }
    button.danger { background: #dc3545; }
    button.success { background: #28a745; }
    button.warn{background:#f7b500;color:#111;}
    .video-wrap { position: relative; width: 100%; max-width: 400px; margin: 10px auto; border: 2px solid #666; border-radius: 8px; overflow: hidden; }
    video { width: 100%; display: block; }
    canvas { display: none; }
    .scan-box { position: absolute; left: 15%; top:15%; width:70%; height:70%; border:2px dashed #fff; pointer-events:none; }
    .result-ok { color: #28a745; font-size: 20px; font-weight: bold; }
    .result-ng { color: #dc3545; font-size: 20px; font-weight: bold; }
    .stat-box { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin: 12px 0; }
    .stat-item { background: #eef5ff; padding: 8px; text-align: center; border-radius: 6px; }
    .rule-item { display: grid; grid-template-columns: 1fr 1fr 1fr 40px; gap: 6px; margin: 6px 0; align-items: center; }
    .history { max-height: 220px; overflow-y: auto; border: 1px solid #ddd; padding: 8px; border-radius: 6px; }
    .modal-mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 999; }
    .modal { background: #fff; padding: 20px; border-radius: 10px; max-width: 340px; width: 90%; }
    .red-text { color: red; font-weight: bold; }
    .hidden { display:none; }
    .history-header {display:flex;justify-content:space-between;align-items:center;}
    #fileInput{display:none;}
</style>
</head>
<body>
<div class="container">
    <!--微信提示块 -->
    <div class="wechat-tip" id="wechatTip">
        ⚠提示：微信内置浏览器扫码性能很差，建议点击右上角【...】→<b>在浏览器打开</b>使用；也可以点下方【相册选码】识别图片二维码。
    </div>

    <h2>二维码校验工具</h2>
    <div class="stat-box">
        <div class="stat-item">总扫描数<br><span id="totalScan">0</span></div>
        <div class="stat-item">合格数<br><span id="okScan">0</span></div>
        <div class="stat-item">不合格数<br><span id="ngScan">0</span></div>
        <div class="stat-item">重码数<br><span id="dupScan">0</span></div>
        <div class="stat-item" style="grid-column:1/-1">合格率：<span id="rate">0.00%</span></div>
    </div>

    <div class="row">
        <label>扫码输入框</label>
        <input id="qrInput" placeholder="扫码或手动输入内容" />
        <button onclick="manualCheck()">手动校验</button>
    </div>

    <div class="row">
        <label>扫码模式：常规模式，扫完一码自动关闭摄像头，需手动重新开启</label>
        <div class="video-wrap">
            <video id="video" playsinline></video>
            <div class="scan-box"></div>
            <canvas id="canvas"></canvas>
        </div>
        <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button id="startBtn" onclick="toggleCamera()">开启摄像头</button>
            <button class="warn" onclick="document.getElementById('fileInput').click()">相册选码</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" onchange="decodeImageFile(event)">
    </div>

    <div class="row">
        <div>当前扫码内容：<span id="currentQr"></span></div>
        <div id="checkResult"></div>
    </div>

    <div class="row">
        <label>规则配置 <button onclick="lockRule()">锁定/解锁配置</button></label>
        <div id="ruleArea">
            <div class="rule-item">
                <span>校验类型</span>
                <span>长度</span>
                <span>固定文本</span>
                <span></span>
            </div>
            <div id="ruleList"></div>
            <button id="addRuleBtn" onclick="addRule()">新增规则字段</button>
            <div class="row" id="pwdArea" style="display:none">
                <label>修改密码</label>
                <input type="password" id="newPwd" />
                <button onclick="savePwd()">保存密码</button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="history-header">
            <label>扫码历史记录</label>
            <button class="danger" style="width:auto;padding:6px 10px" onclick="clearAllHistory()">清空历史</button>
        </div>
        <div class="history" id="historyBox"></div>
    </div>
</div>

<div class="modal-mask" id="alertMask">
    <div class="modal">
        <h3 id="alertTitle">不合格</h3>
        <p id="alertMsg"></p>
        <button id="alertCloseBtn">关闭</button>
    </div>
</div>

<script>
//检测是否微信浏览器
function isWeChatBrowser(){
    return /MicroMessenger/i.test(navigator.userAgent);
}
if(!isWeChatBrowser()){
    document.getElementById("wechatTip").style.display="none";
}

// ========= 默认规则【完整补全】=========
const DEFAULT_BUILTIN_CONFIG = {
    password: "123456",
    rules: [
        { mode: "fixed", len: 16, value: "14040200538_C01#" },
        { mode: "fixed", len: 1,  value: "T" },
        { mode: "length", len: 6, value: "" },
        { mode: "fixed", len: 3,  value: "000" },
        { mode: "length", len: 4, value: "" }
    ]
};
let lockPassword = "123456";
let ruleLocked = true;
let stats = { total: 0, ok: 0, ng: 0, dup: 0 };
let historyList = [];
let cameraOn = false;
let scanLoop = null;
let voiceReady = false;
let lastScanCode = "";
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// 语音播报
function initVoiceAuth() {
    if(voiceReady) return;
    try{
        const utter = new SpeechSynthesisUtterance("");
        window.speechSynthesis.speak(utter);
        voiceReady = true;
    }catch(e){}
}
function speakText(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "zh-CN";
    utterance.rate = 1;
    utterance.onerror = function(){console.log("语音播放失败")};
    window.speechSynthesis.speak(utterance);
}

//安全存储
function safeLocalSet(key, value){
    try{
        localStorage.setItem(key, value);
        return true;
    }catch(err){
        console.error("存储失败",err);
        return false;
    }
}

//清空历史
function clearAllHistory(){
    if(!confirm("确认要清空全部扫码历史记录？此操作不可恢复！")) return;
    historyList = [];
    stats = { total: 0, ok: 0, ng: 0, dup: 0 };
    saveLocal();
    renderHistory();
    updateStat();
    alert("历史记录已全部清空");
}

window.onload = function () {
    loadLocalData();
    renderRule();
    renderHistory();
    updateStat();
    bindModalEvent();
};

function bindModalEvent() {
    const mask = document.getElementById("alertMask");
    mask.addEventListener("click", function (e) {
        if (e.target === mask) closeAlert();
    });
    document.getElementById("alertCloseBtn").addEventListener("click", closeAlert);
}

function loadLocalData() {
    const savedRules = localStorage.getItem("qrRules");
    const savedPwd = localStorage.getItem("qrPwd");
    const savedStats = localStorage.getItem("qrStats");
    const savedHistory = localStorage.getItem("qrHistory");
    if (!savedRules) {
        safeLocalSet("qrRules", JSON.stringify(DEFAULT_BUILTIN_CONFIG.rules));
    }
    if (savedPwd) {
        lockPassword = savedPwd;
    } else {
        lockPassword = DEFAULT_BUILTIN_CONFIG.password;
        safeLocalSet("qrPwd", lockPassword);
    }
    if (savedStats) stats = JSON.parse(savedStats);
    if (savedHistory) historyList = JSON.parse(savedHistory);
}

function saveLocal() {
    safeLocalSet("qrRules", JSON.stringify(getRuleData()));
    safeLocalSet("qrPwd", lockPassword);
    safeLocalSet("qrStats", JSON.stringify(stats));
    safeLocalSet("qrHistory", JSON.stringify(historyList));
}

function getRuleData() {
    const arr = [];
    document.querySelectorAll(".rule-item").forEach((el, idx) => {
        if (idx === 0) return;
        const mode = el.querySelector(".rule-mode").value;
        const len = parseInt(el.querySelector(".rule-len").value);
        const value = el.querySelector(".rule-val").value;
        arr.push({ mode, len, value });
    });
    return arr;
}

function renderRule() {
    const wrap = document.getElementById("ruleList");
    wrap.innerHTML = "";
    const rules = JSON.parse(localStorage.getItem("qrRules"));
    rules.forEach((r, idx) => {
        const div = document.createElement("div");
        div.className = "rule-item";
        div.innerHTML = `
            <select class="rule-mode">
                <option value="fixed" ${r.mode === "fixed" ? "selected" : ""}>固定码模式</option>
                <option value="length" ${r.mode === "length" ? "selected" : ""}>长度校验模式</option>
            </select>
            <input type="number" class="rule-len" value="${r.len}" style="width:70px" />
            <input type="text" class="rule-val ${r.mode === "length" ? "hidden" : ""}" value="${r.value || ""}" />
            <button class="danger del-btn" onclick="this.parentElement.remove();saveLocal();renderRule()">删除</button>
        `;
        wrap.appendChild(div);
    });
    setRuleEdit(ruleLocked);
}

function addRule() {
    const rules = JSON.parse(localStorage.getItem("qrRules"));
    rules.push({ mode: "fixed", len: 1, value: "" });
    safeLocalSet("qrRules", JSON.stringify(rules));
    renderRule();
}

function setRuleEdit(lock) {
    ruleLocked = lock;
    const inputs = document.querySelectorAll("#ruleList input, #ruleList select");
    const delBtns = document.querySelectorAll(".del-btn");
    const addBtn = document.getElementById("addRuleBtn");
    inputs.forEach(i => i.disabled = lock);
    delBtns.forEach(btn => btn.disabled = lock);
    addBtn.disabled = lock;
    document.getElementById("pwdArea").style.display = lock ? "none" : "block";
}

function lockRule() {
    if (ruleLocked) {
        const p = prompt("请输入解锁密码");
        if (p === lockPassword) {
            setRuleEdit(false);
            alert("解锁成功，可以修改规则");
        } else {
            alert("密码错误！");
        }
    } else {
        setRuleEdit(true);
        alert("配置已锁定");
    }
}

function savePwd() {
    const newP = document.getElementById("newPwd").value.trim();
    if (!newP) { alert("密码不能为空"); return; }
    lockPassword = newP;
    saveLocal();
    alert("密码修改成功");
}

//摄像头
function toggleCamera() {
    initVoiceAuth();
    lastScanCode = "";
    if (cameraOn) { stopCamera(); return; }
    startCamera();
}

async function startCamera() {
    try {
        cameraOn = true;
        document.getElementById("startBtn").innerText = "关闭摄像头";
        //微信环境降低分辨率，减轻解码压力
        const idealW = isWeChatBrowser() ? 480 :720;
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width:{ideal:idealW}, height:{ideal:idealW} }
        });
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        if (scanLoop) clearInterval(scanLoop);
        scanLoop = setInterval(scanFrame, isWeChatBrowser()?280:140);
    } catch (err) {
        alert("无法打开摄像头！微信环境建议使用右上角「在浏览器打开」，或使用相册选码");
        cameraOn = false;
    }
}

function stopCamera() {
    cameraOn = false;
    document.getElementById("startBtn").innerText = "开启摄像头";
    if (scanLoop) { clearInterval(scanLoop); scanLoop = null; }
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
}

function scanFrame() {
    if (!cameraOn) return;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imgData.data, imgData.width, imgData.height, {tryHarder:true});
    if (code) {
        if(lastScanCode === code.data) return;
        lastScanCode = code.data;
        handleScanResult(code.data);
    }
}

//相册图片解码（微信备选）
function decodeImageFile(e){
    const file = e.target.files[0];
    if(!file) return;
    const img=new Image();
    img.onload=()=>{
        canvas.width=img.width;
        canvas.height=img.height;
        ctx.drawImage(img,0,0);
        const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
        const res=jsQR(imgData.data,imgData.width,imgData.height,{tryHarder:true});
        if(res){
            handleScanResult(res.data);
        }else{
            alert("图片中未识别到二维码");
        }
        e.target.value="";
    };
    img.src=URL.createObjectURL(file);
}

function handleScanResult(content) {
    stopCamera();
    checkQrContent(content);
    document.getElementById("qrInput").value = "";
}

function manualCheck() {
    const val = document.getElementById("qrInput").value.trim();
    if (!val) return;
    initVoiceAuth();
    checkQrContent(val);
    document.getElementById("qrInput").value = "";
}

function checkQrContent(content) {
    document.getElementById("currentQr").innerText = content;
    document.getElementById("checkResult").innerHTML = "";
    stats.total++;
    const isDup = historyList.some(h => h.content === content);
    if (isDup) {
        stats.dup++; stats.ng++;
        saveLocal(); updateStat();
        showAlert("重码报警", "该二维码已存在历史记录，禁止重复扫码");
        speakText("扫码不合格");
        addHistory(content, false, true);
        return;
    }
    const rules = JSON.parse(localStorage.getItem("qrRules"));
    let pass = true;
    let showHtml = content;
    let pos = 0;
    for (const rule of rules) {
        const len = Number(rule.len);
        if (pos + len > content.length) {
            pass = false;
            showHtml = insertRed(content, pos, content.length - pos);
            break;
        }
        const seg = content.substr(pos, len);
        if (rule.mode === "fixed") {
            if (seg !== rule.value) {
                pass = false;
                showHtml = insertRed(content, pos, len);
                break;
            }
        } else if (rule.mode === "length") {
            if (seg.length !== len) {
                pass = false;
                showHtml = insertRed(content, pos, len);
                break;
            }
        }
        pos += len;
    }
    if (pass) {
        document.getElementById("checkResult").innerHTML = `<span class="result-ok">合格</span>`;
        stats.ok++;
        speakText("扫码合格");
        addHistory(content, true, false);
    } else {
        document.getElementById("checkResult").innerHTML = `<span class="result-ng">不合格：${showHtml}</span>`;
        stats.ng++;
        showAlert("校验不合格", "二维码内容校验不通过");
        speakText("扫码不合格");
        addHistory(content, false, false);
    }
    saveLocal(); updateStat();
}

function insertRed(str, start, length) {
    const before = str.substring(0, start);
    const target = str.substring(start, start + length);
    const after = str.substring(start + length);
    return `${before}<span class="red-text">${target}</span>${after}`;
}

function addHistory(content, ok, dup) {
    historyList.unshift({ content, time: new Date().toLocaleString(), ok, dup });
    renderHistory();
    saveLocal();
}

function renderHistory() {
    const box = document.getElementById("historyBox");
    box.innerHTML = "";
    historyList.forEach(h => {
        const sp = h.ok ? `<span class="result-ok">合格</span>` : h.dup ? `<span class="result-ng">重码</span>` : `<span class="result-ng">不合格</span>`;
        box.innerHTML += `<div>${h.time} | ${h.content} | ${sp}</div>`;
    });
}

function updateStat() {
    document.getElementById("totalScan").innerText = stats.total;
    document.getElementById("okScan").innerText = stats.ok;
    document.getElementById("ngScan").innerText = stats.ng;
    document.getElementById("dupScan").innerText = stats.dup;
    const denominator = stats.total - stats.ng;
    const rate = denominator >0 ? ((stats.ok / denominator)*100).toFixed(2)+"%" : "0.00%";
    document.getElementById("rate").innerText = rate;
}

function showAlert(title, msg) {
    document.getElementById("alertTitle").innerText = title;
    document.getElementById("alertMsg").innerText = msg;
    document.getElementById("alertMask").style.display = "flex";
}
function closeAlert() {
    document.getElementById("alertMask").style.display = "none";
}
</script>
</body>
</html>
